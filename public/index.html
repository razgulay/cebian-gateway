<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cebian</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!--
    Cebian Telegram Mini App — Modern glassmorphism UI with streaming chat.
    Single-file vanilla HTML/CSS/JS (no CDN libs; markdown parser is in-house).

    Wire protocol (matches lib/telegram-gateway/types.ts):
      Mini App → Gateway  : { kind:'webapp_action', request_id, action }
      Gateway → Mini App  : { kind:'webapp_action_result', request_id, ok,
                              partial?, data?, error? }
      Gateway → Mini App  : { kind:'webapp_tool_event', request_id, phase,
                              tool_name, label, elapsed_ms? }
      Gateway → Mini App  : { kind:'extension_status', online: boolean }

    Mini Markdown syntax supported (in renderMarkdown / inlineFormat below):
      **bold**, *italic* / _italic_, `inline code`, ```code blocks```,
      # / ## / ### headers, - / * / 1. lists, [text](url) links.
    HTML is escaped first to prevent injection from LLM output.
  -->
  <style>
    :root {
      /* Telegram theme — defaults overridden by tg.themeParams if available. */
      --bg: var(--tg-theme-bg-color, #17212b);
      --bg-elev: var(--tg-theme-secondary-bg-color, #1e2c39);
      --fg: var(--tg-theme-text-color, #e6e6e6);
      --fg-muted: var(--tg-theme-hint-color, #7d8e9a);
      --accent: var(--tg-theme-button-color, #2ea6da);
      --danger: #e53935;
      --ok: #43a047;

      /* Glassmorphism surfaces — kept semi-opaque for readability. */
      --glass-bg: rgba(30, 44, 57, 0.62);
      --glass-border: rgba(255, 255, 255, 0.07);
      --shadow-md: 0 4px 24px rgba(0, 0, 0, 0.35);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.25);
      --radius-md: 14px;
      --radius-lg: 20px;

      /* Gradient accent — used for live tool pill borders. */
      --gradient-accent: linear-gradient(135deg, #2ea6da 0%, #5288c7 100%);
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --bg-elev: #f4f7fa;
      --fg: #0f172a;
      --fg-muted: #64748b;
      --glass-bg: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(15, 23, 42, 0.08);
      --shadow-md: 0 4px 20px rgba(15, 23, 42, 0.08);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    /* Reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; }

    /* App layout — single column, max 640px on tablets */
    .app {
      display: flex; flex-direction: column;
      height: 100%; max-width: 640px; margin: 0 auto;
      position: relative;
    }

    /* Header — frosted */
    .header {
      padding: 12px 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--glass-border);
      display: flex; align-items: center; gap: 10px;
      font-weight: 600;
      z-index: 5;
    }
    .header .title { flex: 1; }
    .header .status-pill {
      font-size: 11px; font-weight: 500;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--fg-muted);
      display: flex; align-items: center; gap: 6px;
    }
    .header .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--fg-muted);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .header .status-pill.online .status-dot {
      background: var(--ok);
      box-shadow: 0 0 8px rgba(67, 160, 71, 0.7);
    }
    .header .status-pill.offline .status-dot {
      background: #888;
    }

    /* Tab bar */
    .tabs {
      display: flex;
      background: var(--glass-bg);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      padding: 0 8px;
    }
    .tab-btn {
      flex: 1; padding: 14px 8px;
      background: none; border: 0;
      border-bottom: 2px solid transparent;
      color: var(--fg-muted);
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn.active {
      color: var(--fg);
      border-bottom-color: var(--accent);
    }

    /* Views */
    .view {
      display: none;
      flex: 1; min-height: 0;
      flex-direction: column;
    }
    .view.active { display: flex; }

    /* ─── Chat stream ───────────────────────────────────────────────── */
    .chat-stream {
      flex: 1; overflow-y: auto;
      padding: 16px 12px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .chat-stream-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; padding: 32px 24px;
      color: var(--fg-muted); font-size: 13px;
      text-align: center;
    }
    .chat-stream-empty .icon { font-size: 56px; opacity: 0.35; margin-bottom: 16px; }

    .message {
      display: flex; gap: 8px;
      margin-bottom: 14px;
      animation: msg-in 0.25s cubic-bezier(.2,.7,.3,1);
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user { flex-direction: row-reverse; }
    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: var(--radius-lg);
      background: var(--bg-elev);
      box-shadow: var(--shadow-sm);
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      position: relative;
    }
    .message.user .bubble {
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 6px;
    }
    .message.agent .bubble {
      border-bottom-left-radius: 6px;
    }
    .bubble .author {
      font-size: 11px; font-weight: 600;
      opacity: 0.65;
      margin-bottom: 4px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .bubble .body p { margin-bottom: 8px; }
    .bubble .body p:last-child { margin-bottom: 0; }
    .bubble code {
      background: rgba(0, 0, 0, 0.32);
      padding: 1px 5px; border-radius: 4px;
      font: 12.5px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    .bubble pre {
      background: rgba(0, 0, 0, 0.36);
      padding: 10px 12px;
      border-radius: 8px;
      font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      overflow-x: auto;
      margin: 8px 0;
    }
    .bubble pre code { background: none; padding: 0; font-size: inherit; }
    .bubble h1, .bubble h2, .bubble h3 { margin: 10px 0 6px; font-weight: 700; line-height: 1.25; }
    .bubble h1 { font-size: 18px; }
    .bubble h2 { font-size: 16px; }
    .bubble h3 { font-size: 14px; }
    .bubble ul, .bubble ol { padding-left: 22px; margin: 6px 0; }
    .bubble li { margin: 2px 0; }
    .bubble a { color: var(--accent); text-decoration: underline; }
    .bubble strong { font-weight: 700; }
    .bubble em { font-style: italic; }

    /* Blinking caret for streamed-then-finalizing assistant bubble */
    .caret {
      display: inline-block;
      width: 7px; height: 1em;
      background: var(--fg);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: caret-blink 1s steps(2) infinite;
    }
    @keyframes caret-blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Tool activity pill — appears under assistant bubble during prompt turn. */
    .tool-pill {
      display: inline-flex; align-items: center; gap: 8px;
      max-width: 78%;
      margin: 0 0 10px 36px;
      padding: 6px 12px 6px 10px;
      background: rgba(46, 166, 218, 0.10);
      border: 1px solid rgba(46, 166, 218, 0.32);
      border-radius: 999px;
      font-size: 12px;
      color: var(--accent);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      animation: pill-pulse 1.4s ease-in-out infinite;
    }
    @keyframes pill-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(46, 166, 218, 0.25); }
      50% { box-shadow: 0 0 0 4px rgba(46, 166, 218, 0); }
    }
    .tool-pill.complete {
      animation: none;
      opacity: 0.6;
    }
    .tool-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
    }
    .tool-pill.complete .dot { background: var(--ok); }
    .tool-pill .label { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .tool-pill .elapsed { opacity: 0.65; font-size: 11px; margin-left: 4px; }

    /* "Live vision" indicator for capture_tab — pulsing eye + thumbnail. */
    .vision {
      display: flex; flex-direction: column; gap: 8px;
      max-width: 78%;
      margin: 0 0 12px 36px;
      padding: 10px 12px;
      background: rgba(255, 152, 0, 0.10);
      border: 1px solid rgba(255, 152, 0, 0.32);
      border-radius: 12px;
      font-size: 13px;
      color: #ff9800;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .vision .head { display: flex; align-items: center; gap: 8px; }
    .vision .eye { font-size: 18px; animation: vision-blink 1s ease-in-out infinite; display: inline-block; }
    @keyframes vision-blink {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }
    .vision img {
      width: 100%; max-width: 280px;
      border-radius: 8px;
      cursor: zoom-in;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.15s;
    }
    .vision img:active { transform: scale(0.98); }

    /* Composer — pinned at the bottom with frosted background. */
    .composer {
      padding: 10px 12px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--glass-border);
      display: flex; gap: 8px; align-items: flex-end;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    .composer textarea {
      flex: 1;
      min-height: 40px; max-height: 120px;
      padding: 10px 14px;
      background: var(--bg-elev);
      color: var(--fg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      font: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    .composer textarea:focus { border-color: var(--accent); }
    .composer textarea::placeholder { color: var(--fg-muted); }
    .send-btn {
      width: 44px; height: 44px;
      background: var(--accent); color: white;
      border: 0; border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
      transition: opacity 0.2s, transform 0.1s;
    }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn:active:not(:disabled) { transform: scale(0.92); }

    /* ─── Actions view ─────────────────────────────────────────────── */
    .actions-view { padding: 16px 12px; overflow-y: auto; }
    .action-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.15s, box-shadow 0.15s;
    }
    .action-card:active { transform: scale(0.985); }
    .action-card:hover { border-color: var(--accent); }
    .action-card .card-title {
      font-weight: 600; font-size: 15px;
      display: flex; align-items: center; gap: 8px;
    }
    .action-card .card-icon { font-size: 20px; }
    .action-card .card-hint {
      font-size: 12.5px; color: var(--fg-muted);
      margin-top: 4px;
      line-height: 1.45;
    }
    .action-card .card-body { margin-top: 10px; }
    .action-card.busy { pointer-events: none; opacity: 0.6; }

    .tabs-list { margin-top: 14px; }
    .tab-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      background: var(--bg-elev);
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .tab-item.active {
      border: 1px solid var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .tab-item .favicon {
      width: 16px; height: 16px;
      border-radius: 4px;
      flex: 0 0 auto;
      background: var(--bg);
    }
    .tab-item .title {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tab-item .url {
      font-size: 11px; color: var(--fg-muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 60%;
    }
    .tab-item .badge {
      font-size: 10px; padding: 2px 7px;
      background: var(--accent); color: white;
      border-radius: 999px; flex: 0 0 auto;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .empty-hint {
      color: var(--fg-muted); font-size: 12.5px;
      padding: 12px; text-align: center;
    }
    .error-hint { color: var(--danger); font-size: 12.5px; padding: 8px 0; }

    /* ─── Image zoom modal ─────────────────────────────────────────── */
    .zoom {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center; justify-content: center;
      padding: 24px;
      z-index: 100;
      cursor: zoom-out;
    }
    .zoom.active { display: flex; }
    .zoom img {
      max-width: 100%; max-height: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <span class="title">Cebian</span>
      <span class="status-pill" id="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">Connecting…</span>
      </span>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="chat">Chat</button>
      <button class="tab-btn" data-tab="actions">Actions</button>
    </nav>

    <!-- Chat view -->
    <div class="view active" id="view-chat">
      <div class="chat-stream" id="chat-stream">
        <div class="chat-stream-empty" id="chat-empty">
          <div class="icon">💬</div>
          <div>Ask cebian anything.</div>
          <div style="margin-top:6px;opacity:0.7">Or capture a tab to share vision context.</div>
        </div>
      </div>
      <div class="composer">
        <textarea id="prompt-input" placeholder="Message cebian…" rows="1"></textarea>
        <button class="send-btn" id="send-btn" disabled aria-label="Send">↑</button>
      </div>
    </div>

    <!-- Actions view -->
    <div class="view" id="view-actions">
      <div class="actions-view">
        <div class="action-card" id="card-capture">
          <div class="card-title"><span class="card-icon">📸</span> Capture active tab</div>
          <div class="card-hint">Snap the active Chrome tab. Cebian sees it as vision context.</div>
          <div class="card-body" id="capture-preview"></div>
        </div>
        <div class="action-card" id="card-list-tabs">
          <div class="card-title"><span class="card-icon">📑</span> Open tabs</div>
          <div class="card-hint">See what's open in Chrome right now.</div>
          <div class="tabs-list" id="tabs-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Full-screen image zoom -->
  <div class="zoom" id="zoom">
    <img id="zoom-img" alt="Captured tab zoom">
  </div>

  <script>
    'use strict';

    // ───────────────────────────────────────────────────────────
    // Telegram WebApp SDK init
    // ───────────────────────────────────────────────────────────
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      try { tg.ready(); } catch (e) {}
      try { tg.expand(); } catch (e) {}
      try { tg.BackButton && tg.BackButton.hide(); } catch (e) {}
    }

    function applyTheme() {
      if (!tg || !tg.themeParams) return;
      const root = document.documentElement;
      const map = {
        '--bg': 'bg_color',
        '--bg-elev': 'secondary_bg_color',
        '--fg': 'text_color',
        '--fg-muted': 'hint_color',
        '--accent': 'button_color',
      };
      let applied = false;
      for (const [css, tgKey] of Object.entries(map)) {
        const v = tg.themeParams[tgKey];
        if (v) { root.style.setProperty(css, v); applied = true; }
      }
      if (tg.colorScheme === 'light') root.dataset.theme = 'light';
      else if (tg.colorScheme === 'dark') delete root.dataset.theme;
      return applied;
    }
    applyTheme();
    if (tg && tg.onEvent) tg.onEvent('themeChanged', applyTheme);

    const initData = (tg && tg.initData) || '';
    const wsScheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const wsUrl = `${wsScheme}://${location.host}/ws?type=webapp&initData=${encodeURIComponent(initData)}`;

    // ───────────────────────────────────────────────────────────
    // Haptic feedback (no-op outside Telegram)
    // ───────────────────────────────────────────────────────────
    const haptic = {
      tap(kind = 'light') { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind); } catch (e) {} },
      select() { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} },
      notify(kind = 'success') { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} },
    };

    // ───────────────────────────────────────────────────────────
    // DOM refs
    // ───────────────────────────────────────────────────────────
    const statusPill = document.getElementById('status-pill');
    const statusText = document.getElementById('status-text');
    const chatStream = document.getElementById('chat-stream');
    const chatEmpty = document.getElementById('chat-empty');
    const promptInput = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const captureCard = document.getElementById('card-capture');
    const capturePreview = document.getElementById('capture-preview');
    const listTabsCard = document.getElementById('card-list-tabs');
    const tabsList = document.getElementById('tabs-list');
    const zoomModal = document.getElementById('zoom');
    const zoomImg = document.getElementById('zoom-img');

    // ───────────────────────────────────────────────────────────
    // Tabs
    // ───────────────────────────────────────────────────────────
    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === `view-${target}`));
        haptic.select();
      });
    });

    // ───────────────────────────────────────────────────────────
    // WS lifecycle
    // ───────────────────────────────────────────────────────────
    let ws = null;
    let reconnectDelay = 1000;

    function setStatus(online) {
      statusPill.classList.toggle('online', !!online);
      statusPill.classList.toggle('offline', !online);
      statusText.textContent = online ? 'Online' : 'Offline';
      sendBtn.disabled = !promptInput.value.trim() || !online;
    }

    function connect() {
      try { ws = new WebSocket(wsUrl); }
      catch (err) { console.warn('[mini-app] WS constructor failed:', err); scheduleReconnect(); return; }

      ws.addEventListener('open', () => {
        console.log('[mini-app] WS open');
        reconnectDelay = 1000;
      });
      ws.addEventListener('message', (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch (err) { return; }
        handleMessage(msg);
      });
      ws.addEventListener('close', () => {
        setStatus(false);
        scheduleReconnect();
      });
      ws.addEventListener('error', () => { /* close handler drives reconnect */ });
    }
    function scheduleReconnect() {
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 30000);
    }

    // ───────────────────────────────────────────────────────────
    // Smart scroll — only auto-scroll if user is near bottom (so they
    // can scroll up to read history without being yanked).
    // ───────────────────────────────────────────────────────────
    function smartScroll() {
      const slack = chatStream.scrollHeight - chatStream.scrollTop - chatStream.clientHeight;
      if (slack < 200) chatStream.scrollTop = chatStream.scrollHeight;
    }

    // ───────────────────────────────────────────────────────────
    // Chat message rendering
    // ───────────────────────────────────────────────────────────
    function clearEmpty() {
      if (chatEmpty && chatEmpty.parentNode) chatEmpty.remove();
    }

    /** Append a complete message bubble (caller hands already-finalized text). */
    function appendMessage(role, text) {
      clearEmpty();
      const wrap = document.createElement('div');
      wrap.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (role === 'agent') {
        const author = document.createElement('div');
        author.className = 'author';
        author.textContent = 'Cebian';
        bubble.appendChild(author);
      }
      const body = document.createElement('div');
      body.className = 'body';
      body.innerHTML = renderMarkdown(text);
      bubble.appendChild(body);
      wrap.appendChild(bubble);
      chatStream.appendChild(wrap);
      smartScroll();
      return wrap;
    }

    /** Create a streaming assistant bubble. Returns a `feed(delta)` callable
     *  to append partial text, and `finalize(text)` to swap in the
     *  fully-rendered markdown (removing caret). */
    function startStreamingAssistant() {
      clearEmpty();
      const wrap = document.createElement('div');
      wrap.className = 'message agent';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const author = document.createElement('div');
      author.className = 'author';
      author.textContent = 'Cebian';
      bubble.appendChild(author);
      const body = document.createElement('div');
      body.className = 'body';
      const text = document.createElement('span');
      body.appendChild(text);
      const caret = document.createElement('span');
      caret.className = 'caret';
      body.appendChild(caret);
      bubble.appendChild(body);
      wrap.appendChild(bubble);
      chatStream.appendChild(wrap);
      smartScroll();
      return {
        feed(delta) {
          text.textContent += delta;
          smartScroll();
        },
        finalize(fullText) {
          body.innerHTML = renderMarkdown(fullText);
          smartScroll();
        },
        error(message) {
          body.innerHTML = `<span style="color:var(--danger)">⚠ ${escapeHtml(message)}</span>`;
          smartScroll();
        },
      };
    }

    // ───────────────────────────────────────────────────────────
    // Tool activity pills (one per active tool)
    // ───────────────────────────────────────────────────────────
    /** Map tool_name → latest active pill element. Multiple invocations of
     *  the same tool name reuse the latest pill (start → end); a new
     *  invocation starts a new pill. */
    const toolPillByName = new Map();

    function startToolPill(toolName, label) {
      // End any in-flight pill with the same name first (defensive — shouldn't
      // normally happen since `end` arrives before next `start` for same tool).
      const prev = toolPillByName.get(toolName);
      if (prev) prev.classList.add('complete');

      const pill = document.createElement('div');
      pill.className = 'tool-pill';
      pill.dataset.toolName = toolName;
      pill.innerHTML = '';
      const dot = document.createElement('span');
      dot.className = 'dot';
      pill.appendChild(dot);
      const lbl = document.createElement('span');
      lbl.className = 'label';
      lbl.textContent = label || toolName;
      pill.appendChild(lbl);
      chatStream.appendChild(pill);
      toolPillByName.set(toolName, pill);
      smartScroll();
    }
    function endToolPill(toolName, elapsed_ms) {
      const pill = toolPillByName.get(toolName);
      if (!pill) return;
      pill.classList.add('complete');
      if (typeof elapsed_ms === 'number' && elapsed_ms > 0) {
        const e = document.createElement('span');
        e.className = 'elapsed';
        e.textContent = `${(elapsed_ms / 1000).toFixed(1)}s`;
        pill.appendChild(e);
      }
      toolPillByName.delete(toolName);
    }

    // ───────────────────────────────────────────────────────────
    // Vision indicator (capture_tab) — pulsing eye + thumbnail
    // ───────────────────────────────────────────────────────────
    function showVisionIndicator(message, dataUrl) {
      const wrap = document.createElement('div');
      wrap.className = 'vision';
      const head = document.createElement('div');
      head.className = 'head';
      const eye = document.createElement('span');
      eye.className = 'eye';
      eye.textContent = '👁️';
      const m = document.createElement('span');
      m.textContent = message;
      head.appendChild(eye);
      head.appendChild(m);
      wrap.appendChild(head);
      if (dataUrl) {
        const img = document.createElement('img');
        img.src = dataUrl;
        img.alt = 'Tab screenshot';
        img.addEventListener('click', () => {
          zoomImg.src = dataUrl;
          zoomModal.classList.add('active');
          haptic.tap();
        });
        wrap.appendChild(img);
      }
      chatStream.appendChild(wrap);
      smartScroll();
    }

    // ───────────────────────────────────────────────────────────
    // WS action dispatcher
    // ───────────────────────────────────────────────────────────
    const pendingRequests = new Map();

    function sendAction(action, render) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        render({ ok: false, error: 'Extension offline' });
        return;
      }
      const request_id = (crypto.randomUUID && crypto.randomUUID()) ||
        `req-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      pendingRequests.set(request_id, render);
      ws.send(JSON.stringify({ kind: 'webapp_action', request_id, action }));
    }

    function handleMessage(msg) {
      if (!msg || typeof msg.kind !== 'string') return;

      if (msg.kind === 'extension_status') {
        setStatus(msg.online === true);
        return;
      }

      if (msg.kind === 'webapp_action_result') {
        const pending = pendingRequests.get(msg.request_id);
        if (pending) pending(msg);
        // Mini App cleans up its own pending entry on final (partial !== true);
        // partial frames keep the entry alive for the final to arrive.
        if (msg.partial !== true) pendingRequests.delete(msg.request_id);
        return;
      }

      if (msg.kind === 'webapp_tool_event') {
        if (msg.phase === 'start') {
          startToolPill(msg.tool_name, msg.label || msg.tool_name);
        } else {
          endToolPill(msg.tool_name, msg.elapsed_ms);
        }
        return;
      }
    }

    // ───────────────────────────────────────────────────────────
    // Mini Markdown parser — escapes HTML first, then handles:
    //   - ```code blocks``` → <pre><code>
    //   - # / ## / ### headers → <h1>/<h2>/<h3>
    //   - unordered lists (- / *) and ordered lists (1. )
    //   - paragraph
    //   inline:
    //   - **bold**, *italic* / _italic_, `inline code`, [text](url)
    // ───────────────────────────────────────────────────────────
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function renderMarkdown(text) {
      const blocks = String(text).split(/\n{2,}/);
      return blocks.map((block) => {
        // Code block
        if (/^```/.test(block)) {
          const inner = block.replace(/^```[a-zA-Z0-9_-]*\n?/, '').replace(/```$/m, '');
          return `<pre><code>${escapeHtml(inner)}</code></pre>`;
        }
        // Heading (single-line)
        const heading = block.match(/^(#{1,3})\s+(.+?)\s*$/m);
        if (heading && block.trim().split('\n').length === 1) {
          const lvl = heading[1].length;
          return `<h${lvl}>${inlineFormat(heading[2])}</h${lvl}>`;
        }
        // List
        if (/^\s*(?:[-*]|\d+\.)\s+/m.test(block)) {
          const lines = block.split('\n').filter((l) => /^\s*(?:[-*]|\d+\.)\s+/.test(l));
          const ordered = /^\s*\d+\.\s+/.test(lines[0]);
          const tag = ordered ? 'ol' : 'ul';
          const items = lines
            .map((l) => l.replace(/^\s*(?:[-*]|\d+\.)\s+/, ''))
            .map((c) => `<li>${inlineFormat(c)}</li>`)
            .join('');
          return `<${tag}>${items}</${tag}>`;
        }
        // Paragraph (default)
        return `<p>${inlineFormat(block)}</p>`;
      }).join('');
    }

    function inlineFormat(s) {
      const escaped = escapeHtml(s);
      return escaped
        // Bold (must come before italic to avoid double-matching)
        .replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>')
        // Italic — supports *foo* and _foo_
        .replace(/\*([^*\n]+?)\*/g, '<em>$1</em>')
        .replace(/_([^_\n]+?)_/g, '<em>$1</em>')
        // Inline code
        .replace(/`([^`\n]+?)`/g, '<code>$1</code>')
        // Links — only http(s) URLs allowed (no javascript:, etc.)
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
          '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    // ───────────────────────────────────────────────────────────
    // Action: Capture active tab
    // ───────────────────────────────────────────────────────────
    captureCard.addEventListener('click', () => {
      haptic.tap('medium');
      captureCard.classList.add('busy');
      capturePreview.innerHTML = '<div class="empty-hint">Capturing…</div>';
      sendAction({ kind: 'capture_tab', format: 'jpeg', quality: 60 }, (result) => {
        captureCard.classList.remove('busy');
        if (!result.ok) {
          haptic.notify('error');
          capturePreview.innerHTML = `<div class="error-hint">⚠ ${escapeHtml(result.error || 'capture failed')}</div>`;
          return;
        }
        haptic.notify('success');
        const dataUrl = result.data && result.data.dataUrl;
        if (!dataUrl) {
          capturePreview.innerHTML = '<div class="empty-hint">No screenshot received.</div>';
          return;
        }
        capturePreview.innerHTML = '';
        const img = document.createElement('img');
        img.src = dataUrl;
        img.alt = 'Captured active tab';
        img.style.cssText = 'width:100%;border-radius:10px;cursor:zoom-in;border:1px solid var(--glass-border);';
        img.addEventListener('click', () => {
          zoomImg.src = dataUrl;
          zoomModal.classList.add('active');
          haptic.tap();
        });
        capturePreview.appendChild(img);
        // Also surface as a vision event in the chat stream
        showVisionIndicator('Captured active tab', dataUrl);
      });
    });

    // ───────────────────────────────────────────────────────────
    // Action: List tabs
    // ───────────────────────────────────────────────────────────
    listTabsCard.addEventListener('click', () => {
      haptic.tap('medium');
      listTabsCard.classList.add('busy');
      tabsList.innerHTML = '<div class="empty-hint">Loading…</div>';
      sendAction({ kind: 'get_tabs' }, (result) => {
        listTabsCard.classList.remove('busy');
        if (!result.ok) {
          tabsList.innerHTML = `<div class="error-hint">⚠ ${escapeHtml(result.error || 'list tabs failed')}</div>`;
          return;
        }
        const tabs = (result.data && result.data.tabs) || [];
        if (tabs.length === 0) {
          tabsList.innerHTML = '<div class="empty-hint">No tabs reported.</div>';
          return;
        }
        tabsList.innerHTML = '';
        for (const tab of tabs) {
          const item = document.createElement('div');
          item.className = 'tab-item' + (tab.active ? ' active' : '');
          if (tab.favIconUrl) {
            const img = document.createElement('img');
            img.className = 'favicon';
            img.src = tab.favIconUrl;
            img.alt = '';
            img.referrerPolicy = 'no-referrer';
            img.onerror = () => {
              img.replaceWith(Object.assign(document.createElement('div'), {
                className: 'favicon', textContent: '🌐',
                style: 'display:flex;align-items:center;justify-content:center;font-size:12px;',
              }));
            };
            item.appendChild(img);
          } else {
            const ph = document.createElement('div');
            ph.className = 'favicon';
            ph.textContent = '🌐';
            ph.style.cssText = 'display:flex;align-items:center;justify-content:center;font-size:12px;';
            item.appendChild(ph);
          }
          const text = document.createElement('div');
          text.style.cssText = 'flex:1;min-width:0;overflow:hidden;';
          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = tab.title || '(untitled)';
          title.title = tab.url || '';
          text.appendChild(title);
          if (tab.url) {
            const url = document.createElement('div');
            url.className = 'url';
            url.textContent = (() => { try { return new URL(tab.url).host; } catch (e) { return tab.url; } })();
            text.appendChild(url);
          }
          item.appendChild(text);
          if (tab.active) {
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = 'Active';
            item.appendChild(badge);
          }
          tabsList.appendChild(item);
        }
      });
    });

    // ───────────────────────────────────────────────────────────
    // Composer
    // ───────────────────────────────────────────────────────────
    function autoSize() {
      promptInput.style.height = 'auto';
      promptInput.style.height = Math.min(promptInput.scrollHeight, 120) + 'px';
    }
    promptInput.addEventListener('input', () => {
      autoSize();
      sendBtn.disabled = !promptInput.value.trim() || !wsConnected;
    });
    promptInput.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
        ev.preventDefault();
        if (!sendBtn.disabled) sendBtn.click();
      }
    });

    // Track WS connection for send button enable state.
    let wsConnected = false;
    const origSetStatus = setStatus;
    // Wrap setStatus so we also mirror to wsConnected (header already shows pill).
    setStatus = function (online) {
      origSetStatus(online);
      wsConnected = !!online;
    };

    sendBtn.addEventListener('click', () => {
      const text = promptInput.value.trim();
      if (!text) return;
      haptic.tap('medium');

      // 1. Append user bubble immediately.
      appendMessage('user', text);
      promptInput.value = '';
      autoSize();
      sendBtn.disabled = true;

      // 2. Create streaming assistant bubble.
      const stream = startStreamingAssistant();

      // 3. Send prompt action — backend streams partial deltas + final.
      sendAction({ kind: 'prompt', text }, (result) => {
        if (result.partial === true) {
          // Append delta to streaming bubble.
          const delta = (result.data && (result.data.delta || result.data.text)) || '';
          if (delta) stream.feed(delta);
          return;
        }
        if (!result.ok) {
          haptic.notify('error');
          stream.error(result.error || 'unknown error');
          return;
        }
        haptic.notify('success');
        const finalText = (result.data && (result.data.text || result.data.reply)) || '';
        stream.finalize(finalText);
      });
    });

    // ───────────────────────────────────────────────────────────
    // Image zoom close
    // ───────────────────────────────────────────────────────────
    zoomModal.addEventListener('click', () => {
      zoomModal.classList.remove('active');
      haptic.tap('light');
    });

    // ───────────────────────────────────────────────────────────
    // Boot
    // ───────────────────────────────────────────────────────────
    setStatus(false);
    connect();
  </script>
</body>
</html>
